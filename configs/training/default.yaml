output_dir: checkpoints/
data_dir: data/processed/
tokenizer_dir: tokenizer/

# Optimisation
max_steps: 100000
warmup_steps: 2000
batch_size: 8           # per-GPU micro-batch
grad_accum_steps: 16    # effective global batch = 8 * 16 * n_gpus
seq_len: 2048
max_lr: 3.0e-4
min_lr: 3.0e-5
weight_decay: 0.1
grad_clip: 1.0

# Logging / checkpointing
save_every: 1000
eval_every: 500
log_every: 10

# Hardware
dtype: bfloat16
compile: false
backend: nccl
