[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "afrolm"
version = "0.1.0"
description = "Foundation language model for African languages"
authors = [{ name = "AfroLM Contributors" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["nlp", "african-languages", "language-model", "foundation-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "tokenizers>=0.19.0",
    "sentencepiece>=0.2.0",
    "datasets>=2.19.0",
    "accelerate>=0.29.0",
    "einops>=0.7.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "wandb>=0.16.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "langdetect>=1.0.9",
    "sacrebleu>=2.4.0",
    "seqeval>=1.2.2",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]
inference = [
    "bitsandbytes>=0.43.0",
]

[project.scripts]
afrolm-prepare  = "scripts.prepare_data:main"
afrolm-tokenize = "scripts.train_tokenizer:main"
afrolm-pretrain = "scripts.pretrain:main"
afrolm-finetune = "scripts.finetune:main"
afrolm-evaluate = "scripts.evaluate:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["afrolm*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=afrolm --cov-report=term-missing -x"
