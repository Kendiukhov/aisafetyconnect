[project]
name = "semantic-scholar-extractor"
version = "0.1.0"
description = "AWS Lambda for extracting papers from Semantic Scholar API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "boto3>=1.34.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "moto>=5.0.0",  # Mock AWS services for testing
]
